{% include "layout.html" %}

<div class="container">
    <div class="card text-center">
        <div class="card-header">
            Your To-dos!
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Info</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for todo in to_dos %}
                        {% if todo.complete == False %}
                            <tr class="pointer">
                                <td>{{loop.index}}</td>
                                <td>{{todo.title}}</td>
                                <td>
                                    <button onclick="window.location.href='edit-to-do-page/{{todo.id}}'" type="button"
                                            class="btn btn-info">
                                        Edit
                                    </button>
                                </td>
                            </tr>
                        {% else %}
                            <tr class="pointer alert alert-success">
                                <td>{{loop.index}}</td>
                                <td class="strike-through-td">{{todo.title}}</td>
                                <td>
                                    <button onclick="window.location.href='edit-to-do-page/{{todo.id}}'" type="button"
                                            class="btn btn-info">
                                        Edit
                                    </button>
                                </td>
                            </tr>
                        {% endif %}
                    {% endfor %}
                </tbody>
            </table>
            <a href="add-to-do-page" class="btn btn-primary">Add a to-do!</a>
        </div>
    </div>
</div>
